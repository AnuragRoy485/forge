[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-offline-agent"
version = "1.1.0"
description = "FORGE - Fully Offline Reasoning & Generative Engine. A local AI agent with tool use, powered by Ollama."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["requests>=2.31.0", "PyYAML>=6.0"]

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools.packages.find]
include = ["forge*"]
